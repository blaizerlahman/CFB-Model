name: Weekly model update + precompute

# Runs the pipeline on GitHub's runners (free compute), keeps the models + DB in
# a PRIVATE state repo (never in this public repo), and publishes only the small
# public JSON the website serves. See docs/STATIC_SITE_SETUP.md for one-time setup.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC (~Sunday night US). Adjust as desired.
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: weekly-precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # precompute is the long step; ample headroom over the parallel ~20 min
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAT }} # fine-grained PAT: contents RW on STATE_REPO and SITE_REPO
      STATE_REPO: blaizerlahman/cfb-model-state # PRIVATE repo holding state.tar.gz (db + models)
      SITE_REPO: blaizerlahman/personal-site # public site repo that serves the JSON
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state (db + models) from the private store
        run: |
          gh release download state --repo "$STATE_REPO" --pattern 'state.tar.gz' --dir .
          tar xzf state.tar.gz          # restores ./data and ./models
          rm state.tar.gz

      - name: Run weekly pipeline
        run: |
          python -m cfb_model update --current      # ingest finished games + lines
          python -m cfb_model predict               # store this week's picks
          python -m cfb_model analyze --last-week    # grade last week -> results table

      - name: Precompute static JSON
        # Serial is reliable everywhere (~60-70 min, well under the job timeout).
        # To cut it to ~15-20 min on the Linux runner you can switch to parallel:
        #   run: python scripts/precompute_static.py --out output/static --jobs "$(nproc)"
        run: python scripts/precompute_static.py --out output/static

      - name: Save updated state back to the private store
        run: |
          tar czf state.tar.gz data models
          gh release upload state state.tar.gz --repo "$STATE_REPO" --clobber

      - name: Publish JSON to the website repo
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SITE_REPO}.git" site
          mkdir -p site/src/lib/data/cfb
          cp output/static/teams.json output/static/matchups.json output/static/performance.json \
             site/src/lib/data/cfb/
          cd site
          git config user.name  "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data/cfb/*.json
          git commit -m "Weekly CFB data refresh $(date -u +%Y-%m-%d)" || { echo "no changes"; exit 0; }
          git push   # push triggers Vercel's automatic redeploy
